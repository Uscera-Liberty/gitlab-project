[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: Depends()/Query() в аргументах по умолчанию — штатный приём FastAPI
# B904: HTTPException из except — намеренно без цепочки исключений
ignore = ["B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
