# Пайплайн: lint -> test -> build (образ в GitLab Container Registry) -> deploy (сервер по SSH)
#
# Нужные CI/CD Variables (Settings -> CI/CD -> Variables) для стадии deploy:
#   SSH_PRIVATE_KEY  - тип "File", приватный ключ, публичная часть которого лежит
#                      в ~/.ssh/authorized_keys на сервере
#   DEPLOY_HOST      - адрес сервера (IP или DNS)
#   DEPLOY_USER      - пользователь на сервере (должен иметь доступ к docker)
#   SSH_KNOWN_HOSTS  - (рекомендуется) вывод `ssh-keyscan <DEPLOY_HOST>`
# CI_REGISTRY, CI_REGISTRY_IMAGE, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_JOB_TOKEN
# GitLab подставляет сам.

stages:
  - lint
  - test
  - build
  - deploy

# Запускать пайплайн для Merge Request'ов и для пушей в ветки, не дублируя их
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  PYTHON_IMAGE: python:3.12-slim
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  APP_NAME: users-api
  APP_PORT: "8000"
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

# Общий шаблон для Python-джобов: образ и кэш pip между запусками
.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip
  before_script:
    - pip install -r requirements-dev.txt

lint:
  extends: .python
  stage: lint
  script:
    - ruff check .
    - ruff format --check .

test:
  extends: .python
  stage: test
  script:
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

build:
  stage: build
  image: docker:27.5
  services:
    - docker:27.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Прошлый latest используется как кэш слоёв, чтобы не ставить зависимости заново
    - docker pull "$IMAGE_LATEST" || true
    - >
      docker build
      --target runtime
      --cache-from "$IMAGE_LATEST"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      -t "$IMAGE_TAG"
      .
    - docker push "$IMAGE_TAG"
    # latest двигаем только для основной ветки
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_TAG" "$IMAGE_LATEST"
        docker push "$IMAGE_LATEST"
      fi

deploy:
  stage: deploy
  image: alpine:3.20
  environment:
    name: production
    url: http://$DEPLOY_HOST:$APP_PORT
  resource_group: production # не даёт двум деплоям идти одновременно
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - chmod 400 "$SSH_PRIVATE_KEY"
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
      fi
  script:
    # Для pull на сервере: deploy token (если создан с именем gitlab-deploy-token), иначе токен джоба
    - REG_USER="${CI_DEPLOY_USER:-$CI_REGISTRY_USER}"
    - REG_PASS="${CI_DEPLOY_PASSWORD:-$CI_JOB_TOKEN}"
    - |
      ssh -i "$SSH_PRIVATE_KEY" "$DEPLOY_USER@$DEPLOY_HOST" sh -s <<EOF
      set -e
      echo "$REG_PASS" | docker login -u "$REG_USER" --password-stdin "$CI_REGISTRY"
      docker pull "$IMAGE_TAG"
      docker rm -f "$APP_NAME" 2>/dev/null || true
      docker run -d \
        --name "$APP_NAME" \
        --restart unless-stopped \
        -p "$APP_PORT:8000" \
        -v users-data:/data \
        "$IMAGE_TAG"
      docker logout "$CI_REGISTRY"

      # Ждём, пока HEALTHCHECK контейнера станет healthy
      for i in \$(seq 1 20); do
        status=\$(docker inspect -f '{{.State.Health.Status}}' "$APP_NAME")
        echo "health: \$status"
        [ "\$status" = "healthy" ] && exit 0
        sleep 3
      done
      docker logs "$APP_NAME"
      exit 1
      EOF
